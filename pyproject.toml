[project]
name = "reference-based-super-resolution"
version = "0.2.0"
description = "Local reference-adapted video super-resolution"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=16,<17",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.6,<1",
  "numpy==1.26.4",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<12",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
refsr = "ml_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "ml_engine"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests", "ml_engine/tests"]
markers = ["gpu: requires a ROCm-capable GPU"]

